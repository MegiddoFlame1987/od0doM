name: "strategie - typy z rolek vs SPY"

on:
  schedule:
    - cron: "40 21 * * 5"   # piątek wieczorem; spóźnienie crona nie szkodzi
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Typy z rolek
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python strategie/typy_rolek.py
      - name: Zapisz raport do repo
        if: always()
        run: |
          git config user.name "agent-bot"
          git config user.email "agent-bot@users.noreply.github.com"
          git add strategie
          git diff --cached --quiet && exit 0
          git commit -m "strategie: typy z rolek $(TZ=America/New_York date '+%F %H:%M ET')"
          git pull --rebase
          git push
