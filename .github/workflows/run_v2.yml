name: v2 trend (dzienny)

on:
  # Harmonogram wyłączony 2026-10-09: backtest nie przeszedł bramki (REGULY_v2.md, pkt 8).
  # Przywrócenie = zmiana reguł po zobaczeniu wyniku. Zostaje tylko start ręczny.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: v2 trend
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run_v2.py
      - name: Zapisz log do repo
        if: always()
        run: |
          git config user.name "agent-bot"
          git config user.email "agent-bot@users.noreply.github.com"
          git add data data_v2
          git diff --cached --quiet && exit 0
          git commit -m "v2 $(TZ=America/New_York date '+%F %H:%M ET')"
          git pull --rebase
          git push
