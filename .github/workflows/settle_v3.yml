name: v3 rozliczenie sesji

on:
  schedule:
    # po 16:05 ET; co 15 min, skrypt rozlicza tylko raz
    - cron: "*/15 20-23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: v3 rozliczenie
        env:
          CONFIG_MODULE: config_v3
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python settle.py
      - name: Zapisz log do repo
        if: always()
        run: |
          git config user.name "agent-bot"
          git config user.email "agent-bot@users.noreply.github.com"
          git add data data_v2 data_v3
          git diff --cached --quiet && exit 0
          git commit -m "v3 rozliczenie $(TZ=America/New_York date '+%F %H:%M ET')"
          git pull --rebase
          git push
